<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"></path>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"></path>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="578" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"></rect>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">Cerebro Engine — flusso a stati</text>

  <!-- Human-in-the-loop container -->
  <rect x="110" y="48" width="200" height="140" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="290" y="65" font-size="12" fill="#64748b" text-anchor="end">Human in the loop</text>

  <rect x="140" y="90" width="110" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="195" y="123" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Human</text>

  <!-- Autonomous Agents (via CLI) container -->
  <rect x="60" y="258" width="1100" height="110" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="76" y="358" font-size="12" fill="#64748b">Autonomous Agents — via CLI · each on a local or remote model</text>

  <!-- Only via CLI: Integrator + Verifier, inline between reviewer and finalizer -->
  <rect x="728" y="278" width="282" height="64" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="734" y="272" font-size="10" fill="#64748b">only via CLI</text>

  <!-- start -->
  <circle cx="30" cy="310" r="7" fill="#0f172a"></circle>
  <text x="4" y="296" font-size="11" fill="#64748b">new task</text>
  <line x1="37" y1="310" x2="76" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>

  <!-- main pipeline nodes -->
  <rect x="80" y="282" width="118" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="139" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Clarifier</text>

  <rect x="222" y="282" width="96" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="270" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">planner</text>

  <rect x="342" y="282" width="118" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="401" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">organizer</text>

  <rect x="484" y="282" width="104" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="536" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">executor</text>

  <rect x="612" y="282" width="104" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="664" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">reviewer</text>

  <rect x="740" y="282" width="130" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="805" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Integrator</text>

  <rect x="894" y="282" width="104" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="946" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Verifier</text>

  <rect x="1022" y="282" width="118" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="1081" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">finalizer</text>

  <!-- pipeline arrows -->
  <line x1="198" y1="310" x2="220" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="318" y1="310" x2="340" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="460" y1="310" x2="482" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="588" y1="310" x2="610" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <!-- reviewer -> Integrator: conditional, only via CLI -->
  <line x1="716" y1="310" x2="738" y2="310" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"></line>
  <line x1="870" y1="310" x2="892" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <!-- Verifier -> finalizer: conditional, only via CLI -->
  <line x1="998" y1="310" x2="1020" y2="310" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"></line>

  <!-- /ok labels -->
  <rect x="197" y="291" width="26" height="16" fill="#ffffff"></rect>
  <text x="210" y="303" font-size="12" fill="#334155" text-anchor="middle">/ok</text>

  <rect x="705" y="291" width="26" height="16" fill="#ffffff"></rect>
  <text x="718" y="303" font-size="12" fill="#334155" text-anchor="middle">/ok</text>

  <!-- Clarifier <-> Human -->
  <path d="M120,282 C108,240 145,185 175,150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></path>
  <rect x="76" y="205" width="66" height="16" fill="#ffffff"></rect>
  <text x="80" y="217" font-size="12" fill="#334155">/question</text>

  <path d="M215,150 C232,190 200,245 185,282" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></path>
  <rect x="208" y="205" width="60" height="16" fill="#ffffff"></rect>
  <text x="212" y="217" font-size="12" fill="#334155">/answer</text>

  <!-- Human can restart any stage of the horizontal pipeline: a dedicated
       "bus" running under the whole row, tapped into every box, distinct
       (violet, dashed) from the pipeline's own dark arrows. -->
  <path d="M150,146 C 90,180 40,220 45,258" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"></path>
  <line x1="45" y1="258" x2="45" y2="395" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"></line>
  <line x1="45" y1="395" x2="1081" y2="395" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"></line>
  <text x="50" y="412" font-size="11" font-weight="600" fill="#7c3aed">restart</text>

  <line x1="139" y1="395" x2="139" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="270" y1="395" x2="270" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="401" y1="395" x2="401" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="536" y1="395" x2="536" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="664" y1="395" x2="664" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="805" y1="395" x2="805" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="946" y1="395" x2="946" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="1081" y1="395" x2="1081" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>

  <!-- Legend: why the model choice per agent doesn't matter -->
  <rect x="20" y="430" width="430" height="100" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"></rect>
  <text x="40" y="458" font-size="13" font-weight="700" fill="#0f172a">Provider-agnostic</text>
  <text x="40" y="482" font-size="12" fill="#475569">Each agent runs its own configurable model — local or remote.</text>
  <text x="40" y="502" font-size="12" fill="#475569">The goal is what matters, not the model.</text>

  <!-- Legend: restart -->
  <rect x="470" y="430" width="430" height="100" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"></rect>
  <text x="490" y="458" font-size="13" font-weight="700" fill="#7c3aed">Human can restart any stage</text>
  <text x="490" y="482" font-size="12" fill="#475569">The human in the loop isn't limited to answering Clarifier's</text>
  <text x="490" y="502" font-size="12" fill="#475569">questions — any stage of the pipeline can be re-run on demand.</text>
</svg>

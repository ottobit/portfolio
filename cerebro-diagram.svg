<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"></path>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"></path>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="578" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"></rect>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">Cerebro Engine — flusso a stati</text>

  <!-- Human-in-the-loop container -->
  <rect x="110" y="48" width="200" height="140" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="290" y="65" font-size="12" fill="#64748b" text-anchor="end">Human in the loop</text>

  <rect x="140" y="90" width="110" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="195" y="123" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Human</text>

  <!-- Only via CLI: Integrator + Verifier, stacked but staggered (offset
       sideways from each other) so each keeps its own clear index/anchor
       point, raised well above the main chain and centered over reviewer —
       reviewer is the only one that calls into this group and the only one
       it hands back to; reviewer alone still carries the pipeline forward
       to finalizer via its own /ok arrow. Both connectors are straight
       lines aimed directly at the boxes (no loops): the outgoing one
       starts from a point under reviewer's own rect, which is drawn later
       in the document and paints over it, so it visually emerges from
       beneath reviewer. -->
  <rect x="545" y="122" width="260" height="128" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="675" y="136" font-size="10" fill="#64748b" text-anchor="middle">only via CLI</text>

  <rect x="575" y="140" width="110" height="30" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="630" y="160" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Integrator</text>

  <rect x="665" y="205" width="110" height="30" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="720" y="225" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Verifier</text>

  <!-- Integrator -> Verifier -->
  <line x1="670" y1="170" x2="670" y2="203" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>

  <!-- reviewer -> Integrator (conditional call out) — perfectly vertical,
       tail tucked under reviewer's box -->
  <line x1="645" y1="300" x2="645" y2="170" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"></line>
  <!-- Verifier -> reviewer (conditional return) — perfectly vertical,
       ends right at reviewer's top edge -->
  <line x1="715" y1="235" x2="715" y2="282" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"></line>

  <!-- Autonomous Agents (via CLI) container -->
  <rect x="60" y="258" width="820" height="110" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="76" y="358" font-size="12" fill="#64748b">Autonomous Agents — via CLI · each on a local or remote model</text>

  <!-- start -->
  <circle cx="30" cy="310" r="7" fill="#0f172a"></circle>
  <text x="4" y="296" font-size="11" fill="#64748b">new task</text>
  <line x1="37" y1="310" x2="76" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>

  <!-- main pipeline nodes -->
  <rect x="80" y="282" width="110" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="135" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Clarifier</text>

  <rect x="225" y="282" width="95" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="272" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">planner</text>

  <rect x="350" y="282" width="110" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="405" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">organizer</text>

  <rect x="495" y="282" width="95" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="542" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">executor</text>

  <rect x="635" y="282" width="95" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="682" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">reviewer</text>

  <rect x="775" y="282" width="100" height="56" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"></rect>
  <text x="825" y="315" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">finalizer</text>

  <!-- pipeline arrows -->
  <line x1="190" y1="310" x2="223" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="320" y1="310" x2="348" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="460" y1="310" x2="493" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="590" y1="310" x2="633" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="730" y1="310" x2="773" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></line>

  <!-- /ok labels -->
  <rect x="195" y="291" width="26" height="16" fill="#ffffff"></rect>
  <text x="208" y="303" font-size="12" fill="#334155" text-anchor="middle">/ok</text>

  <rect x="738" y="291" width="26" height="16" fill="#ffffff"></rect>
  <text x="751" y="303" font-size="12" fill="#334155" text-anchor="middle">/ok</text>

  <!-- Clarifier <-> Human -->
  <path d="M120,282 C108,240 145,185 175,150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></path>
  <rect x="76" y="205" width="66" height="16" fill="#ffffff"></rect>
  <text x="80" y="217" font-size="12" fill="#334155">/question</text>

  <path d="M215,150 C232,190 200,245 185,282" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"></path>
  <rect x="208" y="205" width="60" height="16" fill="#ffffff"></rect>
  <text x="212" y="217" font-size="12" fill="#334155">/answer</text>

  <!-- Human can restart any stage of the horizontal pipeline: a dedicated
       "bus" running under the whole row, tapped into every box, distinct
       (violet, dashed) from the pipeline's own dark arrows. -->
  <path d="M150,146 C 90,180 40,220 45,258" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"></path>
  <line x1="45" y1="258" x2="45" y2="395" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"></line>
  <line x1="45" y1="395" x2="683" y2="395" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"></line>
  <text x="50" y="412" font-size="11" font-weight="600" fill="#7c3aed">restart</text>

  <!-- Clarifier and finalizer are the only two stages that can't be
       restarted this way — no drop-arrow into either of them. -->
  <line x1="273" y1="395" x2="273" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="405" y1="395" x2="405" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="543" y1="395" x2="543" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>
  <line x1="683" y1="395" x2="683" y2="340" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-violet)"></line>

  <!-- Legend: why the model choice per agent doesn't matter -->
  <rect x="20" y="430" width="420" height="100" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"></rect>
  <text x="40" y="458" font-size="13" font-weight="700" fill="#0f172a">Provider-agnostic</text>
  <text x="40" y="482" font-size="12" fill="#475569">Each agent runs its own configurable model — local or remote.</text>
  <text x="40" y="502" font-size="12" fill="#475569">The goal is what matters, not the model.</text>

  <!-- Legend: restart -->
  <rect x="460" y="430" width="420" height="100" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"></rect>
  <text x="480" y="458" font-size="13" font-weight="700" fill="#7c3aed">Human can restart most stages</text>
  <text x="480" y="482" font-size="12" fill="#475569">planner, organizer, executor and reviewer can be re-run on demand —</text>
  <text x="480" y="502" font-size="12" fill="#475569">only Clarifier and finalizer can't be restarted this way.</text>
</svg>

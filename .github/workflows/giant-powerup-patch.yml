name: Giant power-up patch

on:
  push:
    branches:
      - feat/giant-powerup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/giant-powerup
      - name: Apply patch
        run: python3 scripts/apply-giant-powerup.py
      - name: Check syntax
        run: node --check assets/js/site/ember-arena-game.js
      - name: Commit result
        run: |
          rm scripts/apply-giant-powerup.py
          rm .github/workflows/giant-powerup-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add giant power-up to Ember Keep"
          git push origin HEAD:feat/giant-powerup

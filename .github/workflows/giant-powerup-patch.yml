name: Giant power-up patch

on:
  push:
    branches:
      - feat/giant-powerup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/giant-powerup
      - name: Add giant upgrade
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/site/ember-arena-game.js')
          s = path.read_text()

          old = """    {
        id: 'luck', icon: '🍀', max: 4,
        name: { it: 'Fortuna', en: 'Fortune' },
        desc: { it: 'I mostri lasciano cuori più spesso.', en: 'Monsters drop hearts more often.' },
        apply: (p) => {
            const steps = [0.07, 0.06, 0.05, 0.04];
            p.tuning.heartChance += steps[Math.min(p.pickIndex, steps.length - 1)];
        },
    },
];"""
          new = """    {
        id: 'luck', icon: '🍀', max: 4,
        name: { it: 'Fortuna', en: 'Fortune' },
        desc: { it: 'I mostri lasciano cuori più spesso.', en: 'Monsters drop hearts more often.' },
        apply: (p) => {
            const steps = [0.07, 0.06, 0.05, 0.04];
            p.tuning.heartChance += steps[Math.min(p.pickIndex, steps.length - 1)];
        },
    },
    {
        id: 'giant', icon: '🗿', max: 1,
        name: { it: 'Colosso', en: 'Colossus' },
        desc: { it: 'Diventi 4× più grande e travolgi i mostri comuni.', en: 'Grow 4× larger and crush regular monsters.' },
        apply: (p) => {
            p.player.giantScale = 4;
            p.player.r = 56;
            p.player.meleeDamage = Math.round(p.player.meleeDamage * 1.35);
            p.tuning.meleeRange = Math.max(p.tuning.meleeRange, 100);
        },
    },
];"""
          assert old in s, 'upgrade anchor not found'
          s = s.replace(old, new, 1)

          old = """        r: 14,
        facing: { x: 1, y: 0 },"""
          new = """        r: 14,
        giantScale: 1,
        facing: { x: 1, y: 0 },"""
          assert old in s, 'player anchor not found'
          s = s.replace(old, new, 1)

          old = """        player.facing = { x: 1, y: 0 };
        player.maxHp = 100;"""
          new = """        player.facing = { x: 1, y: 0 };
        player.r = 14;
        player.giantScale = 1;
        player.maxHp = 100;"""
          assert old in s, 'reset anchor not found'
          s = s.replace(old, new, 1)

          old = """            m.flash = Math.max(0, m.flash - dt);
            if (dist < player.r + m.r && hurtPlayer(def.contactDamage || 10)) return;
        }"""
          new = """            m.flash = Math.max(0, m.flash - dt);
            if (dist < player.r + m.r) {
                if (player.giantScale >= 4 && m.type !== 'boss' && m.type !== 'finalBoss') {
                    damageMonster(i, Math.max(m.hp, player.meleeDamage * 2));
                    if (!reducedMotion) shake = Math.max(shake, 3);
                    continue;
                }
                if (hurtPlayer(def.contactDamage || 10)) return;
            }
        }"""
          assert old in s, 'collision anchor not found'
          s = s.replace(old, new, 1)

          old = """        const cell = 3;
        const frame = player.moving ? Math.floor(player.walkT * 8) % 2 : 0;
        const bob = player.moving ? (frame === 0 ? 0 : -1.5) : 0;"""
          new = """        const giantScale = player.giantScale || 1;
        const cell = 3 * giantScale;
        const frame = player.moving ? Math.floor(player.walkT * 8) % 2 : 0;
        const bob = player.moving ? (frame === 0 ? 0 : -1.5 * giantScale) : 0;"""
          assert old in s, 'draw scale anchor not found'
          s = s.replace(old, new, 1)

          old = """        drawShadow(player.x, player.y + 18, 12);"""
          new = """        drawShadow(player.x, player.y + 18 * giantScale, 12 * giantScale);"""
          assert old in s, 'shadow anchor not found'
          s = s.replace(old, new, 1)

          old = """            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y + bob, 30, swordAngle - tail, swordAngle);"""
          new = """            ctx.lineWidth = 3 * giantScale;
            ctx.beginPath();
            ctx.arc(player.x, player.y + bob, 30 * giantScale, swordAngle - tail, swordAngle);"""
          assert old in s, 'spin trail anchor not found'
          s = s.replace(old, new, 1)

          old = """        ctx.fillStyle = '#5d4037';
        ctx.fillRect(8, -4, 3, 8);
        ctx.fillStyle = colors.blade;
        ctx.fillRect(11, -1.5, 17, 3);
        ctx.fillStyle = colors.bladeEdge;
        ctx.fillRect(11, -1.5, 17, 1);"""
          new = """        ctx.scale(giantScale, giantScale);
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(8, -4, 3, 8);
        ctx.fillStyle = colors.blade;
        ctx.fillRect(11, -1.5, 17, 3);
        ctx.fillStyle = colors.bladeEdge;
        ctx.fillRect(11, -1.5, 17, 1);"""
          assert old in s, 'sword anchor not found'
          s = s.replace(old, new, 1)

          path.write_text(s)
          PY
          node --check assets/js/site/ember-arena-game.js
          rm .github/workflows/giant-powerup-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site/ember-arena-game.js .github/workflows/giant-powerup-patch.yml
          git commit -m "feat: add giant power-up to Ember Keep"
          git push origin HEAD:feat/giant-powerup
